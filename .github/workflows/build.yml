name: build-audio-bridge

permissions:
  contents: read

# 本机是 arm64 Linux 且没有 NDK → 交叉编译放云端（模式抄 droid-bluetooth-bridge，含其踩过的坑）。
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "build.sh"
      - "device-assets/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"          # 打 tag 才出 release 资产（安装器只认 release，不认 Actions artifact）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定位或安装 NDK
        run: |
          set -uo pipefail
          CC_REL="toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          found=""
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -x "$ANDROID_NDK_HOME/$CC_REL" ]; then
            found="$ANDROID_NDK_HOME"
          fi
          if [ -z "$found" ]; then
            for c in /usr/local/lib/android/sdk/ndk/* "$HOME/android-sdk/ndk"/*; do
              if [ -x "$c/$CC_REL" ]; then found="$c"; break; fi
            done
          fi
          if [ -z "$found" ]; then
            echo "回落 sdkmanager 安装"
            export ANDROID_HOME="$PWD/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o ct.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            for pkg in "ndk;r27.2.12479018" "ndk;27.0.12077973" "ndk;26.3.11579264"; do
              if "$SM" "$pkg" >/dev/null 2>&1; then found="$ANDROID_HOME/ndk/${pkg#ndk;}"; break; fi
            done
          fi
          [ -n "$found" ] || { echo "拿不到 NDK" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$found" >> "$GITHUB_ENV"

      - name: 编译
        run: |
          sh build.sh
          head -c 20 out/audio-probe | od -c | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: audio-bridge-bins
          path: out/
          if-no-files-found: error

  # 安装器要的是**公开 release 资产**：Actions artifact 需要登录才能取，镜像站也拿不到
  # （droid-drm-takeover 那边已经因此踩过一次）。所以产物除了 artifact 上传，还要发 release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: audio-bridge-bins
          path: out/

      - name: 打包设备侧产物
        run: |
          set -euo pipefail
          STAGE=audio-bridge
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # 设备侧（/data/local/tmp）需要的全部东西：常驻 sink 可执行 + 启动脚本 + 机型线节模板
          cp out/argsloop "$STAGE"/
          cp bin/halsink.sh "$STAGE"/
          cp device-assets/mix2.bin device-assets/dev23.bin device-assets/patch0.bin "$STAGE"/
          # 架构自检：装到安卓上跑不起来的二进制没有意义，宁可不出包
          file "$STAGE/argsloop" | grep -q 'ARM aarch64'
          tar -czf audio-bridge-piano-aarch64.tar.gz "$STAGE"
          rm -rf "$STAGE"
          sha256sum audio-bridge-piano-aarch64.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          draft: true          # 与主仓同一规矩：CI 永不自动公开，人工验证后再发
          files: audio-bridge-piano-aarch64.tar.gz
